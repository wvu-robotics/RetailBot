teleop_twist_joy_node:
  ros__parameters:
    publish_stamped_twist: true
    axis_linear:
      x: 1
    scale_linear:
      x: 1.5
    scale_linear_turbo:
      x: 2.000

    axis_angular:
      yaw: 0
    scale_angular:
      yaw: 4.0
    scale_angular_turbo:
      yaw: 5.36

    enable_button: 3  # L2 shoulder button
    enable_turbo_button: 4 # L1 shoulder button
