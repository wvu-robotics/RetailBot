launch:

- arg:
    name: "server"
    default: "192.168.15.12"
- arg:
    name: "port"
    default: "3883"

- node:
    pkg: "vrpn_mocap"
    namespace: "vrpn_mocap"
    exec: "client_node"
    name: "vrpn_mocap_client_node"
    param:
    -
      name: "server"
      value: "$(var server)"
    -
      name: "port"
      value: "$(var port)"
    -
      name: "sensor_data_qos"
      value: true
    -
      name: "frame_id"
      value: "vicon"
    -
      name: "update_rate"
      value: 200.0
